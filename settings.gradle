buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.palantir.gradle.jdks:gradle-jdks-settings:0.67.0'
    }
}
apply plugin: 'com.palantir.jdks.settings'
rootProject.name = 'auto-parallelizable-root'

include 'auto-parallelizable'
include 'auto-parallelizable-annotations'
include 'integ-test'
